<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1180, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Kit Remote</title>
<script>
// pick the skin before first paint: ?skin=... wins (and is remembered), else last saved, else classic
(function () {
  var skin = 'classic';
  var m = /[?&]skin=([a-z]+)/.exec(location.search);
  try {
    if (m) { skin = m[1]; localStorage.setItem('kitRemoteSkin', skin); }
    else { skin = localStorage.getItem('kitRemoteSkin') || 'classic'; }
  } catch (e) { if (m) skin = m[1]; }
  if (['classic', 'retro', 'hifi'].indexOf(skin) === -1) skin = 'classic';
  document.documentElement.setAttribute('data-skin', skin);
})();
</script>
<script src="main.js"></script>
<style>

@font-face {
  font-family: 'Roboto Condensed';
  src: url('fonts/RobotoCondensed-Variable.woff2') format('woff2');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg);
  overflow: hidden;
  font-family: 'Roboto Condensed', sans-serif;
}

.viewport {
  position: relative;
  width: 100vw;
  height: 100vh;
  width: 100dvw;  /* iOS Safari's 100vh/vw assumes chrome is hidden, causing overflow/scroll until it is; dvw/dvh track the real visible area */
  height: 100dvh;
  background: var(--bg);
  overflow: hidden;
}

.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1180px;
  height: 820px;
  transform-origin: center center;
  background-color: var(--bg);
}

.el { position: absolute; }

/* The Illustrator layout is asymmetric (8.39% left margin vs 10.84% right),
   so everything is nudged right by half the difference to sit centered. */
#content {
  position: absolute;
  left: 1.225%;
  top: 0;
  width: 100%;
  height: 100%;
}

#faceplate, #grille, .screw, #brand-l, #brand-c, #brand-r { display: none; }

/* ===== classic ===== */

  display: flex;
  align-items: center;

}

}
html[data-skin="classic"] #timecode {

  top: 8.58%;

  height: 7.49%;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  white-space: nowrap;
}
html[data-skin="classic"] .btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border-style: solid;
  border-width: var(--btn-stroke-width);

  height: 10.73%;
}
html[data-skin="classic"] .btn:active {

}
html[data-skin="classic"] .btn-square {
  width: 7.46%;
  border-radius: var(--btn-radius-square);
}
html[data-skin="classic"] .btn svg {
  width: 55%;
  height: 55%;
}
html[data-skin="classic"] #btn-loop { left: 8.39%;  border-color: var(--col-loop);    --flash-color: var(--col-loop); }
html[data-skin="classic"] #btn-play { left: 32.8%;  border-color: var(--col-play);    --flash-color: var(--col-play); }
html[data-skin="classic"] #btn-stop { left: 40.93%; border-color: var(--col-stop);    --flash-color: var(--col-stop); }
html[data-skin="classic"] #btn-rewind { left: 57.2%;  border-color: var(--col-rewind);  --flash-color: var(--col-rewind); }
html[data-skin="classic"] #btn-marker { left: 65.35%; border-color: var(--col-marker);  --flash-color: var(--col-marker); }
html[data-skin="classic"] #btn-forward { left: 73.49%; border-color: var(--col-forward); --flash-color: var(--col-forward); }
html[data-skin="classic"] #btn-undo { left: 81.61%; border-color: var(--col-undo);    --flash-color: var(--col-undo); }
html[data-skin="classic"] #btn-record {
  left: 16.53%;
  width: 15.59%;
  border-radius: var(--btn-radius-pill);
  border-color: var(--col-record);
}
html[data-skin="classic"] #btn-record.is-recording {
  background: var(--col-record);
}
html[data-skin="classic"] #btn-record.is-recording .icon-dot {
  fill: #000;
}
html[data-skin="classic"] #btn-play.is-active {
  background: var(--col-play);
}
html[data-skin="classic"] #btn-play.is-active svg path {
  fill: #000;
}
html[data-skin="classic"] #btn-loop.is-active {
  background: var(--col-record);
  border-color: var(--col-record);
}
html[data-skin="classic"] #btn-loop.is-active svg {
  stroke: #000;
}
@keyframes btnFlashBg {
  0% { background: var(--flash-color); }
  100% { background: transparent; }
}
@keyframes btnFlashIconFill {
  0% { fill: #000; }
  100% { fill: var(--flash-color); }
}
@keyframes btnFlashIconStroke {
  0% { stroke: #000; }
  100% { stroke: var(--flash-color); }
}
html[data-skin="classic"] .btn.is-flashing {
  animation: btnFlashBg 350ms ease-out;
}
html[data-skin="classic"] #btn-stop.is-flashing svg rect,
html[data-skin="classic"] #btn-rewind.is-flashing svg rect,
html[data-skin="classic"] #btn-rewind.is-flashing svg path,
html[data-skin="classic"] #btn-forward.is-flashing svg rect,
html[data-skin="classic"] #btn-forward.is-flashing svg path,
html[data-skin="classic"] #btn-marker.is-flashing svg path {
  animation: btnFlashIconFill 350ms ease-out;
}
html[data-skin="classic"] #btn-undo.is-flashing svg {
  animation: btnFlashIconStroke 350ms ease-out;
}
html[data-skin="classic"] #btn-undo.is-flashing .icon-undo-label {
  color: #000;
  transition: color 350ms ease-out;
}
html[data-skin="classic"] #btn-undo .icon-undo-label {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.03em;
  margin-top: 2px;
}
html[data-skin="classic"] #btn-undo {
  flex-direction: column;
  gap: 2px;
}
html[data-skin="classic"] .track-meter {
  top: 34.78%;
  width: 7.46%;
  height: 48.19%;
  border: var(--meter-border-width) solid var(--meter-border);
  overflow: hidden;
}
html[data-skin="classic"] .track-meter-fill {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 0%; 
  background: linear-gradient(
    to top,
    var(--meter-green) 0%,
    var(--meter-green) 70%,
    var(--meter-yellow) 70%,
    var(--meter-yellow) 90%,
    var(--meter-red) 90%,
    var(--meter-red) 100%
  );
  
  background-size: 100% 395px;
  background-position: bottom;
}
html[data-skin="classic"] .track-name {
  top: 85.42%;
  width: 7.46%;
  height: 2.56%;
  padding: 0 4px;
  color: var(--fg);
  font-weight: 400;
  font-size: 15px;
  text-align: center;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
html[data-skin="classic"] .track-label {
  top: 89.18%;
  width: 7.46%;
  height: 2.56%;
  color: var(--fg);
  font-weight: 700;
  font-size: 15px;
  text-align: center;
}
html[data-skin="classic"] #btn-settings {
  left: 96.5%;
  top: 1.5%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.5;
}
html[data-skin="classic"] #btn-settings svg {
  width: 100%;
  height: 100%;
}
html[data-skin="classic"] #btn-settings:active {
  opacity: 1;
}
html[data-skin="classic"] #track-settings-overlay {
  display: none;
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  z-index: 10;
  align-items: center;
  justify-content: center;
}
html[data-skin="classic"] #track-settings-overlay.is-open {
  display: flex;
}
html[data-skin="classic"] #track-settings-panel {
  width: 420px;
  max-height: 80%;
  background: #141414;
  border: 2px solid #444;
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
}
html[data-skin="classic"] #track-settings-title {
  color: #999;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.08em;
  text-align: center;
  margin-bottom: 14px;
}
html[data-skin="classic"] #track-settings-list {
  overflow-y: auto;
}
html[data-skin="classic"] .track-settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 10px;
  border-bottom: 1px solid #2a2a2a;
  font-size: 20px;
  font-weight: 500;
  color: var(--fg);
}
html[data-skin="classic"] .track-settings-row .switch {
  width: 46px;
  height: 26px;
  border-radius: 13px;
  border: 2px solid #666;
  position: relative;

}
html[data-skin="classic"] .track-settings-row .switch .knob {
  position: absolute;
  top: 1px;
  left: 1px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #666;
  transition: left 120ms ease-out;
}
html[data-skin="classic"] .track-settings-row.is-visible .switch {
  border-color: var(--meter-green);
}
html[data-skin="classic"] .track-settings-row.is-visible .switch .knob {
  left: 19px;
  background: var(--meter-green);
}
html[data-skin="classic"] #track-settings-done {
  margin-top: 16px;
  text-align: center;
  padding: 12px;
  border: 2px solid #666;
  border-radius: 10px;
  color: var(--fg);
  font-weight: 700;
  letter-spacing: 0.08em;
}
html[data-skin="classic"] #track-settings-done:active {
  filter: brightness(1.4);
}
html[data-skin="classic"] #btn-loop { color: var(--col-loop); }
html[data-skin="classic"] #btn-record { color: var(--col-record); }
html[data-skin="classic"] #btn-play { color: var(--col-play); }
html[data-skin="classic"] #btn-stop { color: var(--col-stop); }
html[data-skin="classic"] #btn-rewind { color: var(--col-rewind); }
html[data-skin="classic"] #btn-marker { color: var(--col-marker); }
html[data-skin="classic"] #btn-forward { color: var(--col-forward); }
html[data-skin="classic"] #btn-undo { color: var(--col-undo); }
html[data-skin="classic"] .btn svg { stroke-width: 2; }
html[data-skin="classic"] #skin-title,
html[data-skin="classic"] #track-settings-title2 {
  color: #999;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.08em;
  text-align: center;
  margin-bottom: 14px;
}
html[data-skin="classic"] #skin-picker { display: flex; gap: 8px; margin-bottom: 20px; }
html[data-skin="classic"] .skin-opt {
  flex: 1;
  text-align: center;
  padding: 12px 6px;
  border: 2px solid #666;
  border-radius: 10px;
  color: #999;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.08em;
}
html[data-skin="classic"] .skin-opt.is-selected { border-color: #fff; color: #fff; background: #262626; }
/* ===== retro (radio) ===== */
html[data-skin="retro"] {
  --bg: #1a0f0a;
  --ink: #2b170f;
  --maroon: #5a2323;
  --maroon-dk: #3a1515;
  --brass: #c9a227;
  --brass-lt: #e8cf72;
  --brass-dk: #7d5f12;
  --cream: #f3e6bd;
  --cream-lt: #fbf5d8;
  --red: #c0302a;
  --green: #3f7d36;
  --amber: #f2b73a;
  --flash: #e9c24d;

  --meter-green: #5f9137;
  --meter-yellow: #dcae2c;
  --meter-red: #c0302a;
  --meter-border-width: 3px;
}
html[data-skin="retro"] #faceplate {
  position: absolute;
  left: 6%;
  top: 2.6%;
  width: 85.6%;
  height: 91.8%;
  background: linear-gradient(#612828, #471b1b);
  border: 4px solid var(--brass);
  border-radius: 18px;
  box-shadow:
    inset 0 0 0 2px var(--brass-dk),
    inset 0 0 46px rgba(0,0,0,0.5),
    0 10px 26px rgba(0,0,0,0.6);
}
html[data-skin="retro"] #faceplate::after {
  content: '';
  position: absolute;
  inset: 9px;
  border: 1px solid rgba(243, 230, 189, 0.28);
  border-radius: 12px;
  pointer-events: none;
}
html[data-skin="retro"] #grille {
  left: 10%;
  top: 4.9%;
  width: 79.6%;
  height: 2.4%;
  border: 2px solid var(--brass-dk);
  border-radius: 6px;
  background:
    radial-gradient(circle at 50% 50%, var(--brass) 1.3px, transparent 1.9px) 0 0 / 9px 9px,
    #2a0f0f;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.7);
}
html[data-skin="retro"] .screw {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background:
    linear-gradient(45deg, transparent 44%, rgba(60,40,5,0.95) 44% 56%, transparent 56%),
    radial-gradient(circle at 35% 30%, #f6e394, #b58d22 55%, #6a4d0c);
  box-shadow: 0 1px 2px rgba(0,0,0,0.7);
}
html[data-skin="retro"] #btn-metronome {
  left: 8.39%;
  top: 10%;
  width: 30%;
  height: 4.88%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(#4a1c1c, #331010);
  border: 3px solid var(--brass);
  border-radius: 20px;
  box-shadow: inset 0 0 0 1px var(--brass-dk), inset 0 3px 8px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.45);
  color: var(--cream);
  font-weight: 700;
  font-size: 23px;
  letter-spacing: 0.1em;
  white-space: nowrap;
  transition: transform 60ms;
}
html[data-skin="retro"] #btn-metronome:active { transform: translateY(2px); }
html[data-skin="retro"] #btn-metronome.is-active {
  background: linear-gradient(#ffd877, var(--amber));
  color: var(--maroon-dk);
  box-shadow: inset 0 0 0 1px #fff2c4, 0 0 22px rgba(255, 190, 70, 0.75), 0 4px 8px rgba(0,0,0,0.45);
}
html[data-skin="retro"] #timecode {
  left: 65.34%;
  top: 8.4%;
  width: 23.82%;
  height: 7.9%;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 22px;
  background: linear-gradient(#f9f0d0, #e9d9a4);
  border: 3px solid var(--brass);
  border-radius: 16px;
  box-shadow: inset 0 0 0 2px var(--cream-lt), inset 0 4px 12px rgba(90, 55, 20, 0.4), 0 4px 10px rgba(0,0,0,0.45);
  color: var(--ink);
  font-weight: 500;
  font-size: 46px;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
html[data-skin="retro"] .btn {
  top: 19.73%;
  height: 10.73%;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--cream);
  background-image: linear-gradient(rgba(255,255,255,0.65), rgba(255,255,255,0) 55%, rgba(120, 85, 25, 0.16));
  border: 2px solid var(--ink);
  border-radius: 10px;
  color: var(--glyph, var(--maroon));
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.75),
    0 7px 0 var(--ink),
    0 10px 10px rgba(0,0,0,0.45);
  transition: transform 60ms, box-shadow 60ms;
}
html[data-skin="retro"] .btn svg { width: 52%; height: 52%; }
html[data-skin="retro"] .btn:active,
html[data-skin="retro"] .btn.is-active,
html[data-skin="retro"] .btn.is-recording {
  transform: translateY(6px);
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.4), 0 1px 0 var(--ink);
}
html[data-skin="retro"] .btn.is-active,
html[data-skin="retro"] .btn.is-recording {
  background-color: var(--face, var(--red));
  color: var(--cream-lt);
}
html[data-skin="retro"] .btn-square { width: 7.46%; }
html[data-skin="retro"] #btn-loop { left: 8.39%;  --glyph: #5a2a1a;  --face: var(--red); }
html[data-skin="retro"] #btn-record { left: 16.53%; width: 15.59%; --glyph: var(--red); --face: var(--red); }
html[data-skin="retro"] #btn-play { left: 32.8%;  --glyph: var(--green); --face: var(--green); }
html[data-skin="retro"] #btn-stop { left: 40.93%; --glyph: #5a1f1f; }
html[data-skin="retro"] #btn-rewind { left: 57.2%;  --glyph: #5a2a1a; }
html[data-skin="retro"] #btn-marker { left: 65.35%; --glyph: #b0481c; }
html[data-skin="retro"] #btn-forward { left: 73.49%; --glyph: #5a2a1a; }
html[data-skin="retro"] #btn-undo { left: 81.61%; --glyph: #8a6414; flex-direction: column; gap: 2px; }
html[data-skin="retro"] #btn-undo .icon-undo-label {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.04em;
}
@keyframes keyFlash {
  0% {
    background-color: var(--flash);
    color: var(--maroon-dk);
    transform: translateY(6px);
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.4), 0 1px 0 var(--ink);
  }
  100% {
    background-color: var(--cream);
    color: var(--glyph, var(--maroon));
    transform: translateY(0);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.75), 0 7px 0 var(--ink), 0 10px 10px rgba(0,0,0,0.45);
  }
}
html[data-skin="retro"] .btn.is-flashing { animation: keyFlash 380ms ease-out; }
html[data-skin="retro"] .track-meter {
  top: 34.78%;
  height: 48.19%;
  background: linear-gradient(#f7edca, #e6d59e);
  border: var(--meter-border-width) solid var(--brass);
  border-radius: 12px;
  box-shadow:
    inset 0 0 0 2px var(--cream-lt),
    inset 0 5px 14px rgba(90, 55, 20, 0.4),
    0 4px 10px rgba(0,0,0,0.45);

  content: '';
  position: absolute;

  background-image:
    repeating-linear-gradient(to top, var(--ink) 0, var(--ink) 2px, transparent 2px, transparent 16.6667%),

    repeating-linear-gradient(to top, var(--ink) 0, var(--ink) 1px, transparent 1px, transparent 8.3333%),
    repeating-linear-gradient(to top, var(--ink) 0, var(--ink) 1px, transparent 1px, transparent 8.3333%);

  background-position: left top, right top, left top, right top;
  background-repeat: no-repeat;
  opacity: 0.8;
}
html[data-skin="retro"] .track-meter::after {
  content: '';
  position: absolute;
  left: 24%;
  width: 52%;
  top: 0;
  bottom: 0;
  z-index: 0;
  background: rgba(70, 40, 15, 0.22);
  box-shadow: inset 0 0 6px rgba(60, 35, 10, 0.45);

html[data-skin="retro"] .track-meter-fill {
  position: absolute;
  left: 24%;
  bottom: 0;

  background-size: 100% 395px;

  content: '';

  top: -2px;
  height: 4px;
  background: #d8372f;
  border-radius: 2px;

  letter-spacing: 0.06em;
  border-radius: 10px;
  cursor: pointer;
}
html[data-skin="classic"] #track-refresh {
  border: 2px solid #666;
  color: #ddd;
  background: #1d1d1d;
}
html[data-skin="classic"] #track-refresh:active { filter: brightness(1.5); }
html[data-skin="retro"] #track-refresh {
  border: 2px solid var(--brass);
  color: var(--cream);
  background: var(--maroon-dk);
}
html[data-skin="retro"] #track-refresh:active { filter: brightness(1.4); }
html[data-skin="hifi"] #track-refresh {
  border: 2px solid #3d5058;
  border-radius: 8px;
  color: #8ff0ff;
  background: #060d10;
  text-shadow: 0 0 8px rgba(53, 216, 255, 0.6);
}
html[data-skin="hifi"] #track-refresh:active { box-shadow: 0 0 12px rgba(86, 228, 255, 0.6); border-color: var(--cyan); }
</style>
</head>
<body>

<div class="viewport">
  <div class="stage" id="stage">

    <div id="content">
      <div id="faceplate"></div>
      <div class="el" id="grille"></div>
      <i class="el screw" style="left:7.1%; top:3.7%"></i>
      <i class="el screw" style="left:89.9%; top:3.7%"></i>
      <i class="el screw" style="left:7.1%; top:92.0%"></i>
      <i class="el screw" style="left:89.9%; top:92.0%"></i>
      <div class="el" id="brand-l">Model KR-8</div>
      <div class="el" id="brand-c">KIT REMOTE</div>
      <div class="el" id="brand-r">Tracking Console</div>

      <div class="el" id="btn-metronome">CLICK!!!</div>
      <div class="el" id="timecode">00:00:00</div>

      <!-- transport row -->
      <div class="el btn btn-square" id="btn-loop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 2l4 4-4 4"/>
          <path d="M21 6H10a6 6 0 0 0-6 6"/>
          <path d="M7 22l-4-4 4-4"/>
          <path d="M3 18h11a6 6 0 0 0 6-6"/>
        </svg>
      </div>

      <div class="el btn" id="btn-record">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle class="icon-dot" cx="12" cy="12" r="7"/>
        </svg>
      </div>

      <div class="el btn btn-square" id="btn-play">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 3l15 9-15 9V3z"/>
        </svg>
      </div>

      <div class="el btn btn-square" id="btn-stop">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="5" y="5" width="14" height="14"/>
        </svg>
      </div>

      <div class="el btn btn-square" id="btn-rewind">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="3" height="12"/>
          <path d="M20 6l-10 6 10 6V6z"/>
        </svg>
      </div>

      <div class="el btn btn-square" id="btn-marker">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/>
        </svg>
      </div>

      <div class="el btn btn-square" id="btn-forward">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 6l10 6-10 6V6z"/>
          <rect x="15" y="6" width="3" height="12"/>
        </svg>
      </div>

      <div class="el btn btn-square" id="btn-undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 7L4 12l5 5"/>
          <path d="M4 12h11a5 5 0 0 1 0 10h-1"/>
        </svg>
        <div class="icon-undo-label">UNDO</div>
      </div>

      <!-- tracks (generated from the settings selection) -->
      <div id="tracks"></div>
    </div>

    <div class="el" id="btn-settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>

    <div id="track-settings-overlay">
      <div id="track-settings-panel">
        <div id="skin-title">LOOK</div>
        <div id="skin-picker"></div>
        <div id="track-settings-title">SHOW / HIDE TRACKS</div>
        <div id="track-refresh">&#8635; REFRESH FROM CURRENT PROJECT</div>
        <div id="track-settings-list"></div>
        <div id="track-settings-done">DONE</div>
      </div>
    </div>

  </div>
</div>

<script>
// Which REAPER track numbers to actually display (up to MAX_VISIBLE),
// chosen from whatever tracks really exist in the current session via the
// settings panel (gear icon). Remembered on this device via localStorage.
// null means "not configured yet" - defaults to the first MAX_VISIBLE
// tracks found once real session data arrives.
var VISIBLE_TRACKS_KEY = 'kitRemoteVisibleTracks';
var MAX_VISIBLE = 10;

function loadVisibleTracks() {
  try {
    var raw = localStorage.getItem(VISIBLE_TRACKS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveVisibleTracks(arr) {
  try { localStorage.setItem(VISIBLE_TRACKS_KEY, JSON.stringify(arr)); } catch (e) {}
}

var VISIBLE_TRACKS = loadVisibleTracks();
var knownTracks = {}; // REAPER track number -> name, mirrors whatever project is active right now
var knownSig = '';    // snapshot of knownTracks, to notice when the project/tracks change

// original 10-track grid, from the Illustrator spec export
var GRID_LEFT = 8.39;    // % - left edge of track 1
var GRID_RIGHT = 89.07;  // % - right edge of track 10
var GRID_GUTTER = 8 / 1180 * 100; // ~0.68%, same gutter as the Illustrator grid

var tracksEl = document.getElementById('tracks');
var trackNameEls = {};
var trackMeterFillEls = {};

// The tracks to actually draw: the saved selection, limited to tracks the
// current project really has, so switching project tabs can't leave empty
// ghost columns. If none of the saved selection exists in this project, fall
// back to its first MAX_VISIBLE tracks (without overwriting the saved choice).
function visibleList() {
  var known = Object.keys(knownTracks).map(Number).sort(function (a, b) { return a - b; });
  var sel = (VISIBLE_TRACKS || []).slice().sort(function (a, b) { return a - b; });
  if (!known.length) return sel; // no data yet (startup): draw the saved selection
  var live = sel.filter(function (n) { return knownTracks.hasOwnProperty(n); });
  return live.length ? live : known.slice(0, MAX_VISIBLE);
}

var renderedSig = '';

function rebuildTracks() {
  var visible = visibleList();
  renderedSig = visible.join(',');
  if (!visible.length) {
    tracksEl.innerHTML = '';
    trackNameEls = {};
    trackMeterFillEls = {};
    return;
  }

  var totalSpan = GRID_RIGHT - GRID_LEFT;
  var colWidth = (totalSpan - (visible.length - 1) * GRID_GUTTER) / visible.length;

  var html = '';
  for (var i = 0; i < visible.length; i++) {
    var n = visible[i];
    var left = GRID_LEFT + i * (colWidth + GRID_GUTTER);
    var style = 'left:' + left + '%; width:' + colWidth + '%';
    html +=
      '<div class="el track-meter" style="' + style + '" data-track="' + n + '">' +
        '<div class="track-meter-fill"></div>' +
      '</div>' +
      '<div class="el track-name" style="' + style + '" data-track="' + n + '">NAME</div>' +
      '<div class="el track-label" style="' + style + '">TRACK ' + n + '</div>';
  }
  tracksEl.innerHTML = html;

  trackNameEls = {};
  trackMeterFillEls = {};
  for (var j = 0; j < visible.length; j++) {
    var t = visible[j];
    trackNameEls[t] = document.querySelector('.track-name[data-track="' + t + '"]');
    trackMeterFillEls[t] = document.querySelector('.track-meter[data-track="' + t + '"] .track-meter-fill');
    if (knownTracks.hasOwnProperty(t)) trackNameEls[t].textContent = knownTracks[t];
  }
}
rebuildTracks();

// ---------- track show/hide settings panel ----------

var settingsOverlay = document.getElementById('track-settings-overlay');
var settingsList = document.getElementById('track-settings-list');

var settingsTitle = document.getElementById('track-settings-title');

function renderSettingsList() {
  var nums = Object.keys(knownTracks).map(Number).sort(function (a, b) { return a - b; });
  var shown = visibleList();
  settingsTitle.textContent = 'SHOW / HIDE TRACKS (' + shown.length + '/' + MAX_VISIBLE + ')';

  if (!nums.length) {
    settingsList.innerHTML = '<div style="color:#8a8a8a; text-align:center; padding:20px; font-size:16px;">No tracks found yet - make sure a project with tracks is open in REAPER.</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < nums.length; i++) {
    var n = nums[i];
    var visible = shown.indexOf(n) !== -1;
    html +=
      '<div class="track-settings-row' + (visible ? ' is-visible' : '') + '" data-track="' + n + '">' +
        '<span>' + n + '. ' + (knownTracks[n] || '(unnamed)') + '</span>' +
        '<span class="switch"><span class="knob"></span></span>' +
      '</div>';
  }
  settingsList.innerHTML = html;
}

// re-render the open panel in place (keeps the scroll position) when the
// active project's tracks change underneath it
function refreshSettingsListIfOpen() {
  if (!settingsOverlay.classList.contains('is-open')) return;
  var top = settingsList.scrollTop;
  renderSettingsList();
  settingsList.scrollTop = top;
}

settingsList.addEventListener('click', function (e) {
  var row = e.target.closest('.track-settings-row');
  if (!row) return;
  var n = parseInt(row.getAttribute('data-track'), 10);
  VISIBLE_TRACKS = visibleList(); // toggle against what's actually on screen, dropping stale numbers
  var idx = VISIBLE_TRACKS.indexOf(n);
  if (idx === -1) {
    if (VISIBLE_TRACKS.length >= MAX_VISIBLE) return; // at cap - deselect one first
    VISIBLE_TRACKS.push(n);
  } else {
    VISIBLE_TRACKS.splice(idx, 1);
  }
  saveVisibleTracks(VISIBLE_TRACKS);
  renderSettingsList();
  rebuildTracks();
});

document.getElementById('btn-settings').addEventListener('click', function () {
  renderSettingsList();
  settingsOverlay.classList.add('is-open');
});
document.getElementById('track-settings-done').addEventListener('click', function () {
  settingsOverlay.classList.remove('is-open');
});

// Hard reset to whatever project REAPER currently has active: forget every
// track gathered so far, drop the saved selection, and re-read the track
// list straight away. The selection restarts as that project's first
// MAX_VISIBLE tracks, to be adjusted from the list below.
var refreshBtn = document.getElementById('track-refresh');
var refreshLabel = refreshBtn.innerHTML;
var refreshTimer = null;
refreshBtn.addEventListener('click', function () {
  knownTracks = {};
  knownSig = '';
  VISIBLE_TRACKS = null;
  try { localStorage.removeItem(VISIBLE_TRACKS_KEY); } catch (e) {}
  rebuildTracks();
  renderSettingsList();
  wwr_req('TRACK'); // ask now instead of waiting for the next poll tick
  refreshBtn.textContent = 'REFRESHED ✓';
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(function () { refreshBtn.innerHTML = refreshLabel; }, 1400);
});

// ---------- skin switcher ----------

var SKINS = [['classic', 'CLASSIC'], ['retro', 'RADIO'], ['hifi', 'HI-FI']];
var skinPicker = document.getElementById('skin-picker');

function renderSkinPicker() {
  var cur = document.documentElement.getAttribute('data-skin');
  var html = '';
  for (var i = 0; i < SKINS.length; i++) {
    html += '<div class="skin-opt' + (SKINS[i][0] === cur ? ' is-selected' : '') +
            '" data-skin="' + SKINS[i][0] + '">' + SKINS[i][1] + '</div>';
  }
  skinPicker.innerHTML = html;
}

skinPicker.addEventListener('click', function (e) {
  var opt = e.target.closest('.skin-opt');
  if (!opt) return;
  var skin = opt.getAttribute('data-skin');
  document.documentElement.setAttribute('data-skin', skin);
  try { localStorage.setItem('kitRemoteSkin', skin); } catch (err) {}
  renderSkinPicker();
});

document.getElementById('btn-settings').addEventListener('click', renderSkinPicker);

// scale the fixed 1180x820 stage to fit the viewport without scrolling.
// Uses visualViewport when available - it reflects the actual visible area
// on mobile Safari (accounting for the address bar), unlike window.inner*
// which can misreport during/after Safari's chrome shows or hides.
function fitStage() {
  var vv = window.visualViewport;
  var vw = vv ? vv.width : window.innerWidth;
  var vh = vv ? vv.height : window.innerHeight;
  var scale = Math.min(vw / 1180, vh / 820);
  var stage = document.getElementById('stage');
  stage.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', fitStage);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitStage);
  window.visualViewport.addEventListener('scroll', fitStage);
}
fitStage();
setTimeout(fitStage, 300); // re-check after Safari's chrome finishes animating in/out

// ---------- REAPER live wiring ----------
// Requires this page to be served by REAPER's own web server (e.g.
// http://<your-computer's-LAN-IP>:8080/index.html) - wwr_req's "/_/..." calls are
// relative and do nothing when opened as a local file:// page.

var ACTIONS = {
  play: 40044,    // Transport: Play/stop (toggle)
  stop: 1016,     // Transport: Stop
  record: 1013,   // Transport: Record
  loop: 1068,     // Transport: Toggle repeat
  rewind: 40172,  // Markers: Go to previous marker/project start
  forward: 40173, // Markers: Go to next marker/project end
  undo: 40029,    // Edit: Undo
  marker: 40157,  // Markers: Insert marker at current position
  metronome: 40364 // Transport: Toggle metronome
};

var timecodeEl = document.getElementById('timecode');
var btnPlay = document.getElementById('btn-play');
var btnStop = document.getElementById('btn-stop');
var btnRecord = document.getElementById('btn-record');
var btnLoop = document.getElementById('btn-loop');
var btnRewind = document.getElementById('btn-rewind');
var btnMarker = document.getElementById('btn-marker');
var btnForward = document.getElementById('btn-forward');
var btnUndo = document.getElementById('btn-undo');
var btnMetronome = document.getElementById('btn-metronome');

function flashButton(el) {
  el.classList.remove('is-flashing');
  void el.offsetWidth; // restart animation
  el.classList.add('is-flashing');
}

function bindAction(el, actionId, flashOnClick) {
  el.addEventListener('click', function () {
    if (actionId) wwr_req(actionId);
    if (flashOnClick) flashButton(el);
  });
}
bindAction(btnPlay, ACTIONS.play);
bindAction(btnStop, ACTIONS.stop); // flash handled by confirmed TRANSPORT state instead
bindAction(btnRecord, ACTIONS.record);
bindAction(btnLoop, ACTIONS.loop);
bindAction(btnRewind, ACTIONS.rewind, true);
bindAction(btnForward, ACTIONS.forward, true);
bindAction(btnUndo, ACTIONS.undo, true);
bindAction(btnMarker, ACTIONS.marker, true);
bindAction(btnMetronome, ACTIONS.metronome); // confirmed state handled via GET/40364 below

var lastPlaystate = -1;

// maps a meter reading in dB (REAPER sends dB*10) to a 0-100% fill height
var METER_MIN_DB = -60;
var METER_MAX_DB = 0;
function meterDbToPercent(db) {
  var pct = (db - METER_MIN_DB) / (METER_MAX_DB - METER_MIN_DB) * 100;
  if (pct < 0) pct = 0;
  if (pct > 100) pct = 100;
  return pct;
}

// formats raw seconds as HH:MM:SS, independent of REAPER's project ruler
// setting (tok[4] reflects whatever ruler format the project uses, which
// could be measures.beats instead of clock time)
function formatClock(totalSeconds) {
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  var h = Math.floor(totalSeconds / 3600);
  var m = Math.floor((totalSeconds % 3600) / 60);
  var s = totalSeconds % 60;
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  return pad2(h) + ':' + pad2(m) + ':' + pad2(s);
}

function wwr_onreply(results) {
  var lines = results.split('\n');
  var gotTracks = false;
  var seenNow = {};
  for (var i = 0; i < lines.length; i++) {
    var tok = lines[i].split('\t');
    if (tok[0] === 'TRANSPORT' && tok.length > 3) {
      var playstate = parseInt(tok[1], 10);
      var isRepeatOn = parseInt(tok[3], 10) > 0;

      var isPlaying = (playstate & 1) !== 0;   // true for playing(1) and recording(5)
      var isRecording = (playstate & 4) !== 0; // true for recording(5) and rec-paused(6)

      timecodeEl.textContent = formatClock(parseFloat(tok[2]));

      btnPlay.classList.toggle('is-active', isPlaying);
      btnRecord.classList.toggle('is-recording', isRecording);
      btnLoop.classList.toggle('is-active', isRepeatOn);

      if (playstate === 0 && lastPlaystate !== 0 && lastPlaystate !== -1) {
        flashButton(btnStop);
      }
      lastPlaystate = playstate;
    } else if (tok[0] === 'TRACK' && tok.length > 7) {
      var trackNum = parseInt(tok[1], 10);
      if (trackNum < 1) continue; // skip master (0)

      var trackName = tok[2];
      gotTracks = true;
      seenNow[trackNum] = true;
      knownTracks[trackNum] = trackName;

      var nameEl = trackNameEls[trackNum];
      if (nameEl) nameEl.textContent = trackName;

      var fillEl = trackMeterFillEls[trackNum];
      if (fillEl) fillEl.style.height = meterDbToPercent(parseInt(tok[7], 10) / 10) + '%';
    } else if (tok[0] === 'CMDSTATE' && tok.length > 2) {
      if (parseInt(tok[1], 10) === ACTIONS.metronome) {
        btnMetronome.classList.toggle('is-active', parseInt(tok[2], 10) > 0);
      }
    }
  }

  if (!gotTracks) return;

  // every TRACK reply lists the whole active project, so anything we know
  // about that isn't in it any more belongs to a different project tab
  for (var k in knownTracks) {
    if (!seenNow[k]) delete knownTracks[k];
  }

  // first time we've seen real session tracks with no saved preference -
  // default to the first MAX_VISIBLE tracks found
  if (VISIBLE_TRACKS === null) {
    var seen = Object.keys(knownTracks).map(Number);
    if (seen.length) {
      seen.sort(function (a, b) { return a - b; });
      VISIBLE_TRACKS = seen.slice(0, MAX_VISIBLE);
      saveVisibleTracks(VISIBLE_TRACKS);
    }
  }

  // project switched or tracks added/removed/renamed: redraw only if needed
  var sig = JSON.stringify(knownTracks);
  if (sig !== knownSig) {
    knownSig = sig;
    if (visibleList().join(',') !== renderedSig) rebuildTracks();
    refreshSettingsListIfOpen();
  }
}

wwr_req_recur('TRANSPORT;TRACK;GET/' + ACTIONS.metronome, 100);
wwr_start();
</script>

</body>
</html>
