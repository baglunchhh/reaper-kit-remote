name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static checks (syntax, assets, privacy)
        run: node test/static-checks.mjs
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (all looks, fake REAPER server)
        run: node test/smoke.mjs
