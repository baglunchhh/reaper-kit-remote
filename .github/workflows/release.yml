name: Release

# Pushing a version tag (v1.2.3) tests the project, builds the zip and publishes a
# GitHub Release. "Run workflow" (manual) does everything except publish and
# uploads the zip as a build artifact so the packaging can be checked safely.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static checks
        run: node test/static-checks.mjs
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: node test/smoke.mjs
      - name: Package
        run: bash scripts/package-release.sh "${GITHUB_REF_NAME}"
      - name: Keep the build as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: dist/*.zip*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.sha256 \
            --title "${GITHUB_REF_NAME}" --generate-notes
